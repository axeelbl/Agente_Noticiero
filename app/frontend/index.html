<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeluqueriaBot</title>
    <link rel="icon" type="image/png" href="/static/pictures/favicon.png">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div id="avatarContainer" style="text-align:center; margin-bottom:10px;">
        <div id="avatar">
            <div id="avatarHalo"></div>
            <img id="baseFace" src="/static/pictures/eyes_open_mouth_closed.png">
            <img id="mouthOpenImg" src="/static/pictures/eyes_open_mouth_open.png">
        </div>
        <div id="avatarName">Peluquería Bot</div>
        <div id="avatarStatus">🟢 Online</div>
        <div id="profileLinks">
            <a href="mailto:axelberrallopez@gmail.com"
            onclick="window.open('https://mail.google.com/mail/?view=cm&fs=1&to=axelberrallopez@gmail.com'); return false;">
                <!-- Gmail -->
                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 
                    1.1.9 2 2 2h16c1.1 0 
                    2-.9 2-2V6c0-1.1-.9-2-2-2zm0 
                    4-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <span>Email</span>
            </a>

            <a href="https://github.com/axeelbl" target="_blank" aria-label="GitHub">
                <!-- GitHub -->
                <svg viewBox="0 0 24 24">
                    <path d="M12 .5C5.73.5.5 5.74.5 
                    12.02c0 5.1 3.29 9.43 
                    7.86 10.96.58.11.79-.25.79-.56 
                    0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.35-1.29-1.71-1.29-1.71-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.72-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.25 5.69.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.13 0 .31.21.68.8.56A11.52 11.52 0 0 0 23.5 12C23.5 5.74 18.27.5 12 .5z"/>
                </svg>
                <span>GitHub</span>
            </a>

            <a href="#" id="reserveBtn" aria-label="Pedir cita">
                <!-- Calendario -->
                <svg viewBox="0 0 24 24">
                    <path d="M7 2v2H5c-1.1 0-2 .9-2 
                    2v14c0 1.1.9 2 2 2h14c1.1 
                    0 2-.9 2-2V6c0-1.1-.9-2-2-2h-2V2h-2v2H9V2H7zm12 18H5V9h14v11z"/>
                </svg>
                <span>Pedir cita</span>
            </a>
        </div>

    </div>

    <div class="chat-container" id="chatContainer"></div>
    <div class="input-container">
        
        <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
        <button type="button" id="sendBtn">Enviar</button>
        <button type="button" id="clearBtn">Limpiar</button>
        
    </div>


    <div id="bookingModal" class="modal hidden">
        <div class="modal-content">
            <h2>📅 Reservar cita</h2>

            <form id="bookingForm">
                <input type="text" name="name" placeholder="Nombre completo" required>

                <select name="service" required>
                    <option value="">Servicio</option>
                    <option value="Corte">✂️ Corte</option>
                    <option value="Barba">🧔 Barba</option>
                    <option value="Corte + Barba">✂️🧔 Corte + Barba</option>
                </select>

                <input type="date" name="date" required>
                <select name="time" id="timeSelect" required>
                    <option value="">Selecciona una hora</option>
                </select>

                <input type="text" name="contact" placeholder="Teléfono o email" required>

                <div class="modal-actions">
                    <button type="submit">Confirmar cita</button>
                    <button type="button" id="closeModal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script src="/static/booking.js"></script>
</body>
</html>
